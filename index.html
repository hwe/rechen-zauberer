<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211833">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rechen-Zauberer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <title>Rechen-Zauberer</title>
  <style>
    :root{--ink:#302451;--purple:#7046bc;--violet:#a88be8;--cream:#fffaf0;--gold:#f3bd4f;--green:#43886c}
    *{box-sizing:border-box} html{width:100%;height:100%;min-height:100%;overflow-x:hidden;background-color:#171328;background-image:linear-gradient(180deg,#292143 0%,#171328 100%)} body{width:100%;max-width:100%;overflow-x:hidden;margin:0;min-height:100vh;min-height:100svh;min-height:100dvh;color:#f8eacb;font-family:Georgia,"Palatino Linotype",serif;background-color:#171328;background-image:radial-gradient(ellipse at 50% -10%,#59457e 0,#292143 42%,#171328 100%)}
    button,input{font:inherit} .app{width:100%;max-width:980px;min-width:0;margin:auto;padding:max(22px,env(safe-area-inset-top)) 20px max(34px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe99a,#d89236 60%,#82482b);color:#fff6ca;font-size:30px;border:2px solid #f5d78a;box-shadow:0 0 0 4px #593c70,0 0 22px #eec56e77;text-shadow:0 2px 4px #6b382a}.brand h1{font-family:Georgia,"Palatino Linotype",serif;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.2px;color:#fff1c9;text-shadow:0 2px 0 #392545,0 0 13px #e8bf6e55}.brand p{margin:4px 0 0;color:#d5c5eb;font-size:14px;font-style:italic}.header-actions{display:flex;align-items:center;gap:8px}
    .level-badge{background:linear-gradient(145deg,#fff5d9,#e6c17a);border:3px double #a77a39;padding:9px 14px;border-radius:7px 12px 6px 11px;font-weight:800;color:#54346e;white-space:nowrap;box-shadow:0 3px 0 #49304e}.reset{min-height:44px;border:2px solid #bd9451;background:linear-gradient(#fff4d8,#dfbd79);border-radius:7px;padding:8px 10px;color:#63452a;font-size:13px;font-weight:800;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 #49304e}.reset:hover{background:#fff0c4}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch;min-width:0;width:100%}.card{min-width:0;width:100%;background:#fff;border:3px double #b18b4f;border-radius:12px 7px 13px 8px;box-shadow:0 12px 28px #09071788}
    .wizard-card{position:relative;overflow:hidden;min-height:470px;background:radial-gradient(ellipse at 50% 55%,#664c98 0,#342754 53%,#1b1730 100%);border:4px double #d9b56c;box-shadow:0 12px 28px #09071788,inset 0 0 0 5px #f0d28c25;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 22px}.sky{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,#ffe8a8 0 2px,transparent 3px),radial-gradient(circle at 78% 13%,#fff 0 2px,transparent 3px),radial-gradient(circle at 90% 43%,#fff9c9 0 4px,transparent 5px),radial-gradient(circle at 10% 54%,#dcb6ff 0 3px,transparent 4px),radial-gradient(ellipse at 50% 70%,#af8df144,transparent 52%)}
    .wizard{position:relative;z-index:1;display:block;width:270px;height:325px;object-fit:contain;transition:filter .4s,transform .4s;border-radius:24px;filter:drop-shadow(0 8px 3px #59448b28)}.level-2 .wizard{filter:drop-shadow(0 0 11px #fbda75) drop-shadow(0 8px 3px #59448b28)}.level-3 .wizard{filter:drop-shadow(0 0 14px #8bdcff) drop-shadow(0 8px 3px #59448b28)}.level-4 .wizard{filter:drop-shadow(0 0 18px #d4a1ff) drop-shadow(0 8px 3px #59448b28)}.level-5 .wizard{filter:drop-shadow(0 0 23px #ffe678) drop-shadow(0 8px 3px #59448b28);transform:translateY(-3px)}
    .wizard-caption{z-index:2;text-align:center;margin-top:12px;padding:8px 20px 9px;min-width:220px;background:linear-gradient(145deg,#f8e7b7,#c79b52);border:3px double #81592f;border-radius:6px 3px 8px 4px;box-shadow:0 4px 0 #221a35,0 0 14px #eec96833;color:#49321f}.wizard-caption strong{font-family:Georgia,serif;font-size:19px;text-shadow:0 1px #fff0c4}.wizard-caption p{margin:4px 0 0;color:#684d32;font-size:14px;font-style:italic}.crystals{position:absolute;bottom:47px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.crystal{width:35px;height:55px;filter:drop-shadow(0 3px 5px #7153a544)}.crystal.right{width:28px;height:45px}
    .game-card{position:relative;padding:30px;display:flex;flex-direction:column;min-height:470px;background-color:#e8cb8f;background-image:radial-gradient(ellipse at 8% 0%,#fff6d9 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#c5904140 0,transparent 42%),repeating-linear-gradient(0deg,#79532120 0 1px,transparent 1px 4px),linear-gradient(135deg,#f8e9bd,#e8cd91);border:5px double #8c6334;border-radius:9px 5px 12px 7px;box-shadow:0 12px 28px #09071788,inset 0 0 0 3px #fff0c05e}.game-card:before{content:"";position:absolute;inset:8px;border:1px solid #a47b43;border-radius:5px 3px 8px 4px;pointer-events:none;opacity:.7}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;color:#68502e;font-weight:700;font-size:14px}.xp{color:#563373;font-weight:900;white-space:nowrap}.bar{height:15px;border:2px solid #73502f;border-radius:5px;background:#573e5f;margin:11px 0 26px;overflow:hidden;box-shadow:inset 0 1px 4px #1a112c88}.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#69dfc2,#b6ef7d,#f9ce58);box-shadow:0 0 9px #fff5a5;border-radius:3px;transition:width .4s}
    .prompt{font-size:16px;color:#62482b;margin:0 0 8px;font-weight:700;font-style:italic}.problem{max-width:100%;overflow-wrap:anywhere;font-family:Georgia,"Palatino Linotype",serif;font-size:clamp(46px,8vw,66px);font-weight:900;letter-spacing:1px;text-align:center;margin:7px 0 25px;color:#382344;text-shadow:0 1px #fff8dc}.answer-row{display:flex;gap:10px;min-width:0;width:100%}form#answerForm{min-width:0;width:100%}.answer-row input{min-width:0;flex:1;text-align:center;font-family:Georgia,serif;font-size:30px;font-weight:800;color:#49331e;height:64px;border:3px solid #997342;border-radius:7px 4px 8px 5px;outline:none;background:linear-gradient(#fff9e8,#f4e2b6);box-shadow:inset 0 2px 5px #8b6b3640}.answer-row input:focus{border-color:#7750a8;box-shadow:0 0 0 4px #9978d422}.answer-row input::-webkit-inner-spin-button{-webkit-appearance:none}.primary{min-height:48px;border:3px double #f7db91;border-radius:8px 4px 10px 5px;background:linear-gradient(145deg,#8461bd,#503271);color:#fff4d5;font-family:Georgia,serif;font-weight:900;padding:0 23px;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #342143,0 0 12px #7256a533;transition:transform .1s,box-shadow .1s}.primary:hover{background:linear-gradient(145deg,#9875d0,#624182)}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #342143}.primary:disabled{opacity:.55;cursor:default}.feedback:empty{display:none}.feedback{max-width:100%;overflow-wrap:anywhere;min-height:54px;margin:17px 0 0;padding:12px 14px;border-radius:7px 4px 9px 5px;background:#f9edcb;color:#69502e;border:2px solid #c6a365;font-weight:700;line-height:1.35}.feedback.good{background:#e6efcb;color:#41612f;border-color:#9eaf61}.feedback.try{background:#f7dfad;color:#815021;border-color:#ca9651}.feedback.complete{background:#ffe79c;color:#664514;border-color:#c18a38}.level-note{padding:16px 18px;margin-top:20px;border-radius:7px 12px 6px 11px;background:linear-gradient(135deg,#f8eac0,#d7b66f);border:3px double #9a713a;color:#543d27;font-weight:700;text-align:center;font-size:14px;box-shadow:0 5px 0 #372543}
    @media(max-width:700px){header{flex-wrap:wrap;align-items:center;margin-bottom:12px}.brand{flex:1 1 100%;min-width:0}.header-actions{width:100%;justify-content:space-between}.app{padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}.layout{grid-template-columns:minmax(0,1fr);gap:10px}.game-card{order:0;min-height:0;min-width:0;width:100%;padding:14px}.wizard-card{order:1;min-height:0;min-width:0;width:100%;padding:14px 12px 12px;justify-content:center}.wizard{height:165px;width:160px}.wizard-caption{margin-top:7px;padding:6px 14px 7px}.wizard-caption strong{font-size:16px}.wizard-caption p{font-size:12px;margin-top:2px}.crystals{bottom:27px}.crystal{width:27px;height:43px}.crystal.right{width:22px;height:36px}.bar{margin:7px 0 10px}.problem{margin:0 0 11px}.feedback{margin-top:10px}.level-note{margin-top:10px;padding:10px}.answer-row input{height:54px}.primary{min-width:104px}.brand-mark{width:40px;height:40px}.brand p{font-size:12px}}
    @media(max-width:420px){.app{padding-left:9px;padding-right:9px}.brand{gap:8px}.brand h1{font-size:20px}.brand p{font-size:11px}.brand-mark{width:36px;height:36px;font-size:22px}.header-actions{gap:8px;flex-direction:row;align-items:center;justify-content:space-between}.level-badge{font-size:12px;padding:6px 9px}.reset{font-size:11px;padding:5px 8px}.game-card{padding:12px}.answer-row{gap:8px}.answer-row input{min-width:0;height:52px;font-size:25px}.primary{min-width:88px;padding:0 13px}.problem{font-size:44px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><h1>Rechen-Zauberer</h1><p>Rechne dich zum Zaubermeister!</p></div></div><div class="header-actions"><div class="level-badge" id="levelBadge">Level 1 · Lehrling</div><button class="reset" id="reset" type="button" title="Gespeicherten Fortschritt zurücksetzen">Neu starten</button></div></header>
  <section class="layout" aria-label="Rechenspiel">
    <div class="card wizard-card" id="wizardCard" aria-label="Dein Zauberer"><div class="sky"></div>
      <div class="crystals" aria-hidden="true"><svg class="crystal" viewBox="0 0 40 60"><path d="M20 2 35 19 25 56 7 43 3 18Z" fill="#71d9e9" stroke="#fff" stroke-width="3"/><path d="m20 2 2 35 13-18M22 37l3 19" fill="none" stroke="#d7fbff" stroke-width="2"/></svg><svg class="crystal right" viewBox="0 0 40 60"><path d="M20 2 35 19 25 56 7 43 3 18Z" fill="#c78cff" stroke="#fff" stroke-width="3"/><path d="m20 2 2 35 13-18" fill="none" stroke="#f7e9ff" stroke-width="2"/></svg></div>
      <img class="wizard" src="assets/milo-level-1.jpg" alt="Milo, der Zauberlehrling"><div class="wizard-caption"><strong id="wizardTitle">Milo, der Zauberlehrling</strong><p id="wizardDesc">Löse Aufgaben und sammle Zauberkraft!</p></div>
    </div>
    <div class="card game-card"><div class="topline"><span id="streak">Aufgabe 1</span><span class="xp"><span id="xp">0</span> / 100 XP</span></div><div class="bar" aria-label="Fortschritt bis zum nächsten Level"><div class="bar-fill" id="barFill"></div></div>
      <p class="prompt">Wie viel ist …?</p><div class="problem" id="problem" aria-live="polite">24 + 13 = ?</div>
      <form id="answerForm"><div class="answer-row"><input id="answer" type="text" inputmode="numeric" enterkeyhint="done" maxlength="3" autocomplete="off" autocapitalize="off" spellcheck="false" pattern="[0-9]*" aria-label="Deine Antwort" required><button class="primary" id="submit" type="submit">Prüfen</button></div></form>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    </div>
  </section><div class="level-note" id="levelNote">✨ Noch 10 richtige Antworten bis Level 2!</div>
</main>
<script>
(()=>{
 const names=['Milo, der Zauberlehrling','Milo mit Funkelstab','Milo, Kristallmagier','Milo, Meister der Zauber','Milo, der große Zaubermeister'];
 const desc=['Löse Aufgaben und sammle Zauberkraft!','Sein Stab beginnt zu leuchten!','Ein magischer Umhang schützt ihn.','Sein Umhang funkelt vor Zauberkraft!','Der mächtigste Zauberer des Zahlenreichs!'];
 const titles=['Lehrling','Zauberstab','Kristallmagier','Zaubermeister','Großmeister'];
 const xpEl=document.querySelector('#xp'), fill=document.querySelector('#barFill'), card=document.querySelector('#wizardCard'), form=document.querySelector('#answerForm'), input=document.querySelector('#answer'), submit=document.querySelector('#submit'), feedback=document.querySelector('#feedback');
 const storageKey='rechen-zauberer-progress-v1';
 let total=0, taskNo=1, current={a:24,b:13,op:'+'};
 try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Number.isInteger(saved.xp))total=Math.max(0,Math.min(400,Math.floor(saved.xp/10)*10));}catch{}
 function rand(n){return Math.floor(Math.random()*n)}
 function makeTask(){
   const op=Math.random()<.52?'+':'−'; let a,b;
   if(op==='+'){
     // Early practice includes single/two-digit sums, tens and a few crossing-ten examples; always at most 100.
     const kind=rand(5);
     if(kind===0){a=rand(21);b=rand(21)}
     else if(kind===1){a=10+rand(81);b=rand(101-a)}
     else if(kind===2){a=10+rand(70);b=10+rand(101-a-10)}
     else if(kind===3){a=10+rand(80);b=rand(Math.min(20,101-a))}
     else {a=rand(81);b=10+rand(21); if(a+b>100) a=100-b-rand(10)}
   } else {
     // Never negative. Mix within a ten, crossing a ten, and subtraction of tens.
     const kind=rand(4);
     if(kind===0){a=rand(20);b=rand(a+1)}
     else if(kind===1){a=20+rand(81);b=rand(a+1)}
     else if(kind===2){a=20+rand(81);b=10+rand(20);if(b>a)b=a}
     else {a=10+rand(9)*10+rand(10); b=rand(a+1)}
   }
   current={a,b,op}; document.querySelector('#problem').textContent=`${a} ${op} ${b} = ?`; input.value=''; if(!window.matchMedia('(pointer: coarse)').matches)input.focus(); taskNo++; document.querySelector('#streak').textContent=`Aufgabe ${taskNo}`;
 }
 function render(){const level=Math.min(5,Math.floor(total/100)+1), points=total%100; xpEl.textContent=level===5&&total>=400?100:points; fill.style.width=(level===5&&total>=400?'100%':points+'%'); card.className='card wizard-card level-'+level; const wizard=document.querySelector('.wizard'); wizard.src=`assets/milo-level-${level}.jpg`; wizard.alt=names[level-1]; document.querySelector('#levelBadge').textContent=`Level ${level} · ${titles[level-1]}`; document.querySelector('#wizardTitle').textContent=names[level-1]; document.querySelector('#wizardDesc').textContent=desc[level-1]; document.querySelector('#levelNote').textContent=level<5?`✨ Noch ${10-(points/10)} richtige ${10-(points/10)===1?'Antwort':'Antworten'} bis Level ${level+1}!`:'🌟 Level 5 erreicht! Milo ist jetzt ein großer Zaubermeister!'; }
 form.addEventListener('submit',e=>{e.preventDefault();if(input.value==='')return; const answer=Number(input.value), correct=current.op==='+'?current.a+current.b:current.a-current.b;
   if(answer===correct){const oldLevel=Math.min(5,Math.floor(total/100)+1);total=Math.min(400,total+10);try{localStorage.setItem(storageKey,JSON.stringify({xp:total}));}catch{}render();const newLevel=Math.min(5,Math.floor(total/100)+1);if(newLevel>oldLevel){feedback.className='feedback complete';feedback.textContent=`🎉 Level ${newLevel}! Milo ist jetzt ${titles[newLevel-1].toLowerCase()}!`; }else if(total===400){feedback.className='feedback complete';feedback.textContent='🌟 Richtig! Milo ist schon ein Zaubermeister!';}else{feedback.className='feedback good';feedback.textContent='✨ Richtig! +10 XP für Milo!';}submit.disabled=true;setTimeout(()=>{submit.disabled=false;feedback.className='feedback';feedback.textContent='';makeTask();},1200);
   }else{feedback.className='feedback try';feedback.textContent='Fast! Versuch es noch einmal. Du schaffst das!';input.select();}
 });
 render();
 if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
 document.querySelector('#reset').addEventListener('click',()=>{total=0;taskNo=0;try{localStorage.removeItem(storageKey);}catch{}feedback.className='feedback';feedback.textContent='';render();makeTask();});
})();
</script>
</body>
</html>
